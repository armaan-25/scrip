<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Scrip — live Agent Card mint</title>
<style>
  /*
    Same visual identity as agents-live.html (paper/ink/ramp-yellow on a
    dark surface), reshaped for a single reserveCardPurchase() call: one
    task pool, one purchase reservation, one minted card, one settlement -
    the flow a worker uses when it needs a real payment instrument instead
    of a metering record. Runs against MockCardIssuer in this environment
    (no RAMP_CARDHOLDER_USER_ID set) - see docs/ramp-api-notes.md for why
    the real RampAgentCardIssuer path isn't wired into a browser demo yet.
  */
  :root {
    --paper: #fafaf7;
    --ink: #16150f;
    --ink-muted: #86847c;
    --ramp-yellow: #e4f222;
    --denied-red: #8a3b32;
    --surface: #101010;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--surface);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }
  .stage { width: min(420px, 92vw); display: flex; flex-direction: column; gap: 16px; }

  .eyebrow {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #8f8d86;
    text-align: center;
  }
  .eyebrow b { color: var(--ramp-yellow); font-weight: 600; }

  .wordmark {
    text-align: center;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.01em;
    font-style: italic;
    color: var(--paper);
    opacity: 0.9;
  }

  .pool {
    background: #1c1c1c;
    border: 1px solid #2c2c2c;
    border-radius: 4px;
    padding: 14px 16px;
  }
  .pool-labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }
  .pool-labels b { color: var(--paper); font-variant-numeric: tabular-nums; }
  /* ---------- ascii pool bar ---------- */
  .pool-bar-ascii {
    letter-spacing: 0.02em;
    color: #2c2c2c;
    white-space: pre;
  }
  .pool-bar-ascii .bar-fill { color: var(--ramp-yellow); }
  .pool-bar-ascii .bar-empty { color: #2c2c2c; }

  /* ---------- ascii card ---------- */
  .ascii-card {
    margin: 0;
    text-align: center;
    line-height: 1.5;
    letter-spacing: 0.01em;
    color: var(--ink-muted);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.5s ease-out, transform 0.5s ease-out;
  }
  .ascii-card.shown { opacity: 1; transform: translateY(0); }
  .ascii-card .lit { color: var(--ramp-yellow); }
  .ascii-card .bright { color: var(--paper); }

  .agents { display: flex; flex-direction: column; gap: 8px; min-height: 56px; }
  .agent {
    background: #1c1c1c;
    border: 1px solid #2c2c2c;
    color: var(--paper);
    border-radius: 4px;
    padding: 11px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.35s ease-out, transform 0.35s ease-out;
  }
  .agent.shown { opacity: 1; transform: translateY(0); }
  .agent-name {
    font-weight: 600;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .agent-name .sub {
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
  }
  .pill {
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-muted);
  }
  .pill::before { content: '['; }
  .pill::after { content: ']'; }
  .pill.committed { color: var(--ramp-yellow); }
  .amt { font-weight: 700; color: var(--ramp-yellow); }

  .status {
    letter-spacing: 0.05em;
    color: #8f8d86;
    text-align: center;
    min-height: 1.6em;
  }
  .status b { color: var(--ramp-yellow); font-weight: 600; }
  .status.error b { color: var(--denied-red); }

  @media (prefers-reduced-motion: reduce) {
    .agent, .ascii-card { transition: none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="wordmark">SCRIP</div>
  <p class="eyebrow">one <b>reserveCardPurchase()</b> call. one real payment instrument.</p>

  <div class="pool">
    <div class="pool-labels">
      <span>Research budget · task pool</span>
      <span><b id="pool-remaining">$5.00</b> left of $5.00</span>
    </div>
    <div class="pool-bar-ascii" id="pool-bar"></div>
  </div>

  <pre class="ascii-card" id="ascii-card"></pre>

  <div class="agents" id="agents"></div>

  <p class="status" id="status">connecting…</p>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => `$${Number(n).toFixed(2)}`;
  const TOTAL = 5;
  let remaining = TOTAL;

  function setStatus(text, isError = false) {
    $('status').innerHTML = text;
    $('status').classList.toggle('error', isError);
  }

  // ---- ascii pool bar: a plain [████░░░░] meter instead of a CSS pill ----
  const BAR_WIDTH = 24;
  function setPool(value) {
    remaining = value;
    $('pool-remaining').textContent = fmt(Math.max(remaining, 0));
    const filled = Math.max(0, Math.min(BAR_WIDTH, Math.round((Math.max(remaining, 0) / TOTAL) * BAR_WIDTH)));
    $('pool-bar').innerHTML =
      `[<span class="bar-fill">${'█'.repeat(filled)}</span><span class="bar-empty">${'░'.repeat(BAR_WIDTH - filled)}</span>]`;
  }

  // ---- ascii card: a fixed-width box-drawn card instead of a CSS gradient card ----
  const CARD_INNER = 32;
  const cardData = { state: '', number: '•••• •••• •••• ••••', merchant: '', cap: '' };

  function padBetween(left, right) {
    const gap = Math.max(CARD_INNER - left.length - right.length, 1);
    return left + ' '.repeat(gap) + right;
  }
  function cardLine(text = '', cls = '') {
    const padded = ('│ ' + text.padEnd(CARD_INNER) + ' │');
    return cls ? padded.replace(text, `<span class="${cls}">${text}</span>`) : padded;
  }
  function renderCard() {
    const top = '┌' + '─'.repeat(CARD_INNER + 2) + '┐';
    const bottom = '└' + '─'.repeat(CARD_INNER + 2) + '┘';
    const merchantLine = cardData.merchant ? `merchant: ${cardData.merchant}` : '';
    const lines = [
      top,
      cardLine(padBetween('AGENT CARD', cardData.state), 'lit'),
      cardLine(''),
      cardLine(cardData.number, 'bright'),
      cardLine(''),
      cardLine(merchantLine),
      cardLine(cardData.cap ? padBetween('', cardData.cap) : '', 'lit'),
      bottom,
    ];
    $('ascii-card').innerHTML = lines.join('\n');
    $('ascii-card').classList.add('shown');
  }

  function ensureRow() {
    const el = document.createElement('div');
    el.className = 'agent';
    el.innerHTML = `
      <div class="agent-name">vendor_dataset_license<span class="sub">purchase reservation</span></div>
      <div class="agent-status"><span class="pill">reserved</span></div>
    `;
    $('agents').appendChild(el);
    requestAnimationFrame(() => el.classList.add('shown'));
    return el;
  }

  let row = null;

  function handle(event) {
    switch (event.type) {
      case 'authorized':
        setStatus(`task authorized for <b>${fmt(event.allowance)}</b> on ${event.budget}`);
        break;

      case 'reserving': {
        row = ensureRow();
        remaining -= event.maximumCost;
        setPool(remaining);
        cardData.merchant = event.merchant;
        cardData.cap = `cap ${fmt(event.maximumCost)}`;
        renderCard();
        setStatus(`reserving ${fmt(event.maximumCost)} for <b>${event.merchant}</b> — minting a card…`);
        break;
      }

      case 'card_minted': {
        cardData.state = event.state;
        cardData.number = `•••• •••• •••• ${event.last4}`;
        renderCard();
        setStatus(`card <b>${event.cardId}</b> minted — •••• ${event.last4}, locked to this reservation`);
        break;
      }

      case 'committed': {
        if (row) {
          row.querySelector('.agent-status').innerHTML =
            `<span class="amt">${fmt(event.actualCost)}</span><span class="pill committed">committed</span>`;
        }
        setStatus(`spent ${fmt(event.actualCost)} on the card — real cost, real deduction`);
        break;
      }

      case 'settled':
        setStatus(`settled — ${fmt(event.actual)} spent, <b>${fmt(event.returned)} released</b> back automatically`);
        break;

      case 'error':
        setStatus(event.message, true);
        break;
    }
  }

  setPool(TOTAL);
  renderCard();
  $('ascii-card').classList.remove('shown');

  const source = new EventSource('/events');
  source.onmessage = (msg) => handle(JSON.parse(msg.data));
  source.onerror = () => {
    setStatus('lost connection to the live server — reload to run it again', true);
    source.close();
  };
</script>
</body>
</html>
