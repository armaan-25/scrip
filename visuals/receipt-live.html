<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Scrip — live settlement receipt</title>
<style>
  /*
    Same visual identity as the recorded version, but every number on this
    page comes from real HTTP calls to a running `npm run http-server`
    (default http://localhost:8787) - see the <script> at the bottom.
    Nothing here is hardcoded: authorize $10, commit two real actions,
    settle, then animate whatever the receipt JSON actually says.

    Color   — paper #FAFAF7, ink #16150F, ink-muted #86847C,
              ramp-yellow #E4F222 (the one accent, spent only on the
              returned amount and the settled stamp), surface #101010.
  */

  :root {
    --paper: #fafaf7;
    --ink: #16150f;
    --ink-muted: #86847c;
    --ramp-yellow: #e4f222;
    --denied-red: #8a3b32;
    --surface: #101010;
    --surface-vignette: #1a1a1a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse 900px 600px at 50% 30%, var(--surface-vignette), var(--surface) 70%);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    color: var(--ink);
    padding: 48px 20px;
    overflow-x: hidden;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .status {
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: #8f8d86;
    text-align: center;
    max-width: 380px;
    line-height: 1.6;
    min-height: 1.6em;
  }

  .status b { color: var(--ramp-yellow); font-weight: 600; }
  .status.error b { color: var(--denied-red); }

  .receipt-wrap {
    position: relative;
    width: min(360px, 86vw);
    transform: rotate(-1.4deg);
    filter: drop-shadow(0 22px 40px rgba(0, 0, 0, 0.55)) drop-shadow(0 2px 3px rgba(0, 0, 0, 0.3));
  }

  .receipt {
    position: relative;
    background: var(--paper);
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.018), rgba(0,0,0,0.018) 1px, transparent 1px, transparent 3px);
    padding: 30px 26px 0;
  }

  .receipt::before {
    content: "";
    position: absolute;
    top: -7px; left: 0; right: 0; height: 14px;
    background: radial-gradient(circle at 8px 7px, var(--surface) 6px, transparent 6.5px);
    background-size: 16px 14px;
    background-position: -4px 0;
  }

  .receipt-body { padding-bottom: 26px; }

  .head { text-align: center; margin-bottom: 18px; }
  .wordmark { font-size: 28px; font-weight: 900; letter-spacing: -0.01em; font-style: italic; }
  .budget-line {
    margin-top: 6px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .rule { border: none; border-top: 1.5px dashed rgba(34,31,26,0.35); margin: 14px 0; opacity: 0; transition: opacity 0.35s ease-out; }
  .rule.shown { opacity: 1; }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    line-height: 1.7;
    font-variant-numeric: tabular-nums;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.4s ease-out, transform 0.4s ease-out;
  }
  .row.shown { opacity: 1; transform: translateY(0); }

  .row .sub {
    display: block;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-top: 2px;
  }

  .row .amt { font-weight: 600; white-space: nowrap; }
  .row.total .amt { font-weight: 700; }

  .tear-zone { position: relative; margin-top: 8px; }
  .perf-line { height: 0; border-top: 2px dotted rgba(34,31,26,0.4); position: relative; z-index: 3; }

  .stub {
    position: relative;
    z-index: 2;
    background: var(--paper);
    padding: 16px 26px 22px;
    clip-path: polygon(
      0% 10px, 4% 0, 9% 9px, 14% 1px, 19% 8px, 24% 0, 29% 9px, 34% 1px,
      39% 8px, 44% 0, 49% 9px, 54% 1px, 59% 8px, 64% 0, 69% 9px, 74% 1px,
      79% 8px, 84% 0, 89% 9px, 94% 1px, 100% 10px, 100% 100%, 0% 100%
    );
    transform-origin: 50% 0%;
    transition: transform 0.85s cubic-bezier(0.5, -0.2, 0.7, 0.3), opacity 0.85s cubic-bezier(0.5, -0.2, 0.7, 0.3);
  }
  .stub.torn { transform: rotate(11deg) translate(26px, 210px); opacity: 0; }

  .returned-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-weight: 700;
    opacity: 0;
    transition: opacity 0.4s ease-out;
  }
  .returned-row.shown { opacity: 1; }

  .returned-row .sub {
    display: block;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
    margin-top: 2px;
  }

  .returned-row .amt { position: relative; z-index: 0; }
  .returned-row .amt::before {
    content: "";
    position: absolute;
    left: -6px; right: -6px; top: 12%; bottom: 8%;
    background: var(--ramp-yellow);
    z-index: -1;
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.3s ease-out;
  }
  .returned-row.shown .amt::before { transform: scaleX(1); }

  .stamp-plate {
    position: absolute; z-index: 1; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding-bottom: 8px;
    background: var(--paper);
  }

  .stamp {
    background: var(--ramp-yellow);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 3px;
    padding: 7px 18px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    transform: rotate(-7deg) scale(1.9);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.2, 1.4, 0.5, 1), opacity 0.4s cubic-bezier(0.2, 1.4, 0.5, 1);
  }
  .stamp.shown { transform: rotate(-7deg) scale(1); opacity: 1; }
  .stamp small { display: block; font-size: 9px; letter-spacing: 0.1em; text-align: center; margin-top: 2px; opacity: 0.85; }

  .foot-perf {
    height: 14px;
    background: radial-gradient(circle at 8px 7px, var(--surface) 6px, transparent 6.5px);
    background-size: 16px 14px;
    background-position: -4px 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .row, .rule, .returned-row, .stamp { transition: none !important; }
    .stub { transition: none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="receipt-wrap">
    <div class="receipt">
      <div class="receipt-body">
        <div class="head">
          <div class="wordmark">SCRIP</div>
          <div class="budget-line" id="budget-line">research budget · connecting…</div>
        </div>

        <div class="row" id="row-authorized">
          <span class="label">Authorized</span>
          <span class="amt" id="amt-authorized">—</span>
        </div>

        <hr class="rule" id="rule-1" />

        <div class="row" id="row-item-1">
          <span class="label">Inference<span class="sub">claude-sonnet-5</span></span>
          <span class="amt" id="amt-item-1">—</span>
        </div>
        <div class="row" id="row-item-2">
          <span class="label">Paid API<span class="sub">vendor_lookup</span></span>
          <span class="amt" id="amt-item-2">—</span>
        </div>

        <hr class="rule" id="rule-2" />

        <div class="row total" id="row-actual">
          <span class="label">Actual</span>
          <span class="amt" id="amt-actual">—</span>
        </div>
      </div>

      <div class="tear-zone">
        <div class="perf-line"></div>
        <div class="stub" id="stub">
          <div class="returned-row" id="row-returned">
            <span class="label">Returned<span class="sub">reserved, never spent — released automatically at settlement</span></span>
            <span class="amt" id="amt-returned">—</span>
          </div>
        </div>
        <div class="stamp-plate">
          <div class="stamp" id="stamp">Settled<small id="stamp-outcome">success</small></div>
        </div>
      </div>
    </div>
    <div class="foot-perf"></div>
  </div>

  <p class="status" id="status">connecting to <b>localhost:8787</b>…</p>
</div>

<script>
  const API = 'http://localhost:8787';
  const BUDGET = 'research';
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => `$${Number(n).toFixed(2)}`;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function setStatus(text, isError = false) {
    $('status').innerHTML = text;
    $('status').classList.toggle('error', isError);
  }

  async function call(path, opts = {}) {
    const res = await fetch(`${API}${path}`, {
      method: opts.method || 'GET',
      headers: {
        'Content-Type': 'application/json',
        ...(opts.credential ? { Authorization: `Bearer ${opts.credential}` } : {}),
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(`${path} -> ${res.status} ${body.error || res.statusText}`);
    }
    return res.status === 204 ? null : res.json();
  }

  async function run() {
    try {
      // 1. Authorize a real $10 task against the real running Scrip backend.
      const taskId = `visual-${Date.now()}`;
      const issued = await call('/v1/tasks', {
        method: 'POST',
        body: { budget: BUDGET, taskId, task: 'Review PR 418', allowance: 10 },
      });
      $('budget-line').textContent = `${BUDGET} budget · task authorized`;
      $('amt-authorized').textContent = fmt(issued.authorization.allowance);
      $('row-authorized').classList.add('shown');
      setStatus('reserved $10.00 — running two real committed actions…');
      await sleep(700);
      $('rule-1').classList.add('shown');

      // 2. Two real actions - reserve then commit, exactly like the CLI/tests do.
      await sleep(500);
      const inference = await call('/v1/actions/reserve', {
        method: 'POST',
        credential: issued.credential,
        body: { actionType: 'inference', label: 'claude-sonnet-5', maximumCost: 5 },
      });
      await call(`/v1/actions/${inference.reservationId}/commit`, {
        method: 'POST',
        body: { actualCost: 4.5 },
      });
      $('amt-item-1').textContent = fmt(4.5);
      $('row-item-1').classList.add('shown');

      await sleep(700);
      const paidApi = await call('/v1/actions/reserve', {
        method: 'POST',
        credential: issued.credential,
        body: { actionType: 'paid_api', label: 'vendor_lookup', maximumCost: 3 },
      });
      await call(`/v1/actions/${paidApi.reservationId}/commit`, {
        method: 'POST',
        body: { actualCost: 1.7 },
      });
      $('amt-item-2').textContent = fmt(1.7);
      $('row-item-2').classList.add('shown');

      await sleep(700);
      $('rule-2').classList.add('shown');

      // 3. Settle for real - the receipt below is exactly what the backend returns.
      setStatus('settling task…');
      const receipt = await call(`/v1/tasks/${issued.authorization.authorizationId}/settle`, {
        method: 'POST',
        body: { status: 'success', evidence: 'PR 418 merged, tests passing' },
      });
      $('amt-actual').textContent = fmt(receipt.actual);
      $('row-actual').classList.add('shown');
      setStatus(`task settled — only ${fmt(receipt.actual)} of ${fmt(receipt.authorized)} was actually spent`);

      await sleep(900);
      $('amt-returned').textContent = fmt(receipt.returned);
      $('row-returned').classList.add('shown');

      await sleep(500);
      $('stub').classList.add('torn');
      $('stamp-outcome').textContent = receipt.outcome;
      await sleep(200);
      $('stamp').classList.add('shown');

      setStatus(`money is only ever held for as long as it's needed — <b>${fmt(receipt.returned)} back</b>, automatically, no reconciliation`);
    } catch (err) {
      console.error(err);
      setStatus(
        `couldn't reach the backend: <b>${err.message}</b><br/>run <b>npm run http-server</b> first, then reload this page.`,
        true
      );
    }
  }

  run();
</script>
</body>
</html>
