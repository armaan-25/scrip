<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Scrip — console</title>
<style>
  /*
    The landing-page reimagining: task+budget pinned at top, agent list
    beneath it (same paper/ink/ramp-yellow language as agents-live.html),
    and clicking a row slides in a detail pane streaming that agent's own
    real Chrome tab (via console-server.ts's /agent/:id/stream, backed by
    playwright-cli) - proving the delegated slice is being spent against a
    real, navigable storefront, not just a domain-object transition.
  */
  :root {
    --paper: #fafaf7;
    --ink: #16150f;
    --ink-muted: #86847c;
    --ramp-yellow: #e4f222;
    --denied-red: #8a3b32;
    --surface: #101010;
    --panel: #1c1c1c;
    --border: #2c2c2c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    min-height: 100vh;
    background: var(--surface);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    color: var(--paper);
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 0px;
    min-height: 100vh;
    transition: grid-template-columns 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .layout.detail-open { grid-template-columns: minmax(0, 1fr) min(560px, 46vw); }

  .main { padding: 40px 32px; display: flex; flex-direction: column; gap: 20px; max-width: 640px; margin: 0 auto; width: 100%; }

  .eyebrow {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #8f8d86;
  }
  .eyebrow b { color: var(--ramp-yellow); font-weight: 600; }

  .wordmark {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.01em;
    font-style: italic;
    color: var(--paper);
    opacity: 0.9;
  }

  .header-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }

  /* ---------- task/budget card ---------- */
  .task-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px 20px;
  }
  .task-title { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .task-sub { font-size: 11px; color: var(--ink-muted); margin: 0 0 14px; }

  .pool-labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }
  .pool-labels b { color: var(--paper); font-variant-numeric: tabular-nums; }
  .pool-track {
    height: 10px;
    background: #0a0a0a;
    border-radius: 999px;
    overflow: hidden;
  }
  .pool-fill {
    height: 100%;
    width: 100%;
    background: var(--ramp-yellow);
    border-radius: 999px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ---------- agent list ---------- */
  .section-label {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 4px 0 0;
  }

  .agents { display: flex; flex-direction: column; gap: 8px; min-height: 168px; }

  .agent {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--paper);
    border-radius: 4px;
    padding: 11px 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 6px 10px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.35s ease-out, transform 0.35s ease-out, border-color 0.3s ease-out, background 0.15s ease-out;
    cursor: pointer;
  }
  .agent.shown { opacity: 1; transform: translateY(0); }
  .agent.denied { border-color: var(--denied-red); cursor: default; }
  .agent:not(.denied):hover { background: #232323; border-color: #3a3a3a; }
  .agent.active { border-color: var(--ramp-yellow); }

  .agent-name {
    font-weight: 600;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .agent-name .sub {
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
  }

  .agent-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
    margin-left: auto;
  }

  .pill {
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-muted);
  }
  .pill::before { content: '['; }
  .pill::after { content: ']'; }
  .pill.committed { color: var(--ramp-yellow); }
  .pill.pending { color: var(--ink-muted); }
  .pill.denied { color: var(--denied-red); }

  .amt { font-weight: 700; color: var(--ramp-yellow); }
  .amt.denied-amt { color: var(--denied-red); text-decoration: line-through; text-decoration-color: rgba(138,59,50,0.5); }
  .amt.clamped-amt { color: var(--denied-red); }

  .watch-hint { font-size: 10px; color: var(--ink-muted); letter-spacing: 0.04em; }
  .agent:not(.denied):hover .watch-hint { color: var(--ramp-yellow); }

  .pill.clamped { color: var(--denied-red); }
  .trust-rate {
    font-size: 10px;
    color: var(--denied-red);
    letter-spacing: 0.04em;
  }

  /* ---------- track-record seeding strip ---------- */
  .history {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 9px 14px;
    font-size: 11px;
    color: var(--ink-muted);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.35s ease-out, transform 0.35s ease-out;
  }
  .history.shown { opacity: 1; transform: translateY(0); }
  .history .pip {
    width: 9px;
    height: 9px;
    border-radius: 999px;
    background: #2c2c2c;
    flex-shrink: 0;
    transition: background 0.25s ease-out;
  }
  .history .pip.failed { background: var(--denied-red); }
  .history .pip.resolved { background: var(--ramp-yellow); }
  .history-label { white-space: nowrap; }
  .history-rate { margin-left: auto; font-weight: 700; color: var(--denied-red); white-space: nowrap; }

  .status {
    letter-spacing: 0.05em;
    color: #8f8d86;
    min-height: 1.6em;
  }
  .status b { color: var(--ramp-yellow); font-weight: 600; }
  .status.error b { color: var(--denied-red); }

  /* ---------- detail pane ---------- */
  .detail {
    border-left: 1px solid var(--border);
    background: #0c0c0c;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .detail-inner { padding: 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; min-width: 0; }
  .detail-header { display: flex; align-items: center; justify-content: space-between; }
  .detail-title { font-size: 13px; font-weight: 600; }
  .detail-sub { font-size: 10px; color: var(--ink-muted); letter-spacing: 0.05em; }
  .close-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink-muted);
    border-radius: 4px;
    padding: 4px 10px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .close-btn:hover { color: var(--paper); border-color: #4a4a4a; }

  .browser-frame {
    flex: 1;
    min-height: 0; /* defeats flex's default min-height:auto, which let a
      full-size screenshot <img> grow this box past the viewport instead of
      being clamped by it - reproduced live while recording the demo video */
    background: #000;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .browser-frame img { width: 100%; height: 100%; object-fit: contain; object-position: top; display: block; }
  .browser-frame .placeholder { color: var(--ink-muted); font-size: 11px; letter-spacing: 0.05em; }
  .live-dot {
    position: absolute;
    top: 10px;
    left: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,0.6);
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--paper);
  }
  .live-dot::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: var(--ramp-yellow);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  @media (prefers-reduced-motion: reduce) {
    .agent, .pool-fill, .layout, .live-dot::before { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="layout" id="layout">
  <div class="main">
    <div class="header-row">
      <div class="wordmark">SCRIP</div>
      <p class="eyebrow">console · <b>live</b></p>
    </div>

    <div class="task-card">
      <p class="task-title" id="task-title">Buy party supplies for the office event</p>
      <p class="task-sub" id="task-sub">connecting…</p>
      <div class="pool-labels">
        <span>Research budget · task pool</span>
        <span><b id="pool-remaining">$10.00</b> left of $10.00</span>
      </div>
      <div class="pool-track"><div class="pool-fill" id="pool-fill"></div></div>
    </div>

    <div class="history" id="history">
      <span class="history-label">tableware · prior settlements</span>
      <span class="pip" id="pip-0"></span>
      <span class="pip" id="pip-1"></span>
      <span class="pip" id="pip-2"></span>
      <span class="history-rate" id="history-rate"></span>
    </div>

    <p class="section-label">Agents delegated a slice of this task</p>
    <div class="agents" id="agents"></div>

    <p class="status" id="status">connecting…</p>
  </div>

  <div class="detail" id="detail">
    <div class="detail-inner">
      <div class="detail-header">
        <div>
          <div class="detail-title" id="detail-title">—</div>
          <div class="detail-sub" id="detail-sub">—</div>
        </div>
        <button class="close-btn" id="close-detail">close ×</button>
      </div>
      <div class="browser-frame" id="browser-frame">
        <span class="placeholder" id="browser-placeholder">connecting to browser…</span>
      </div>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => `$${Number(n).toFixed(2)}`;
  const TOTAL = 10;
  let remaining = TOTAL;
  const rows = new Map();
  let activeStream = null;
  let activeAgentId = null;

  function setStatus(text, isError = false) {
    $('status').innerHTML = text;
    $('status').classList.toggle('error', isError);
  }

  function setPool(value) {
    remaining = value;
    $('pool-remaining').textContent = fmt(Math.max(remaining, 0));
    $('pool-fill').style.width = `${Math.max((remaining / TOTAL) * 100, 0)}%`;
  }

  function agentLabel(id) {
    return id.replace('agent-', '').replaceAll('-', ' ');
  }

  function ensureRow(agentId, label) {
    if (rows.has(agentId)) return rows.get(agentId);
    const el = document.createElement('div');
    el.className = 'agent';
    el.innerHTML = `
      <div class="agent-name">${label || agentLabel(agentId)}<span class="sub">requesting…</span></div>
      <div class="agent-status">
        <span class="pill pending">pending</span>
        <span class="watch-hint">watch →</span>
      </div>
    `;
    el.addEventListener('click', () => {
      if (el.classList.contains('denied')) return;
      openDetail(agentId, label || agentLabel(agentId));
    });
    $('agents').appendChild(el);
    requestAnimationFrame(() => el.classList.add('shown'));
    rows.set(agentId, el);
    return el;
  }

  function openDetail(agentId, label) {
    if (activeStream) {
      activeStream.close();
      activeStream = null;
    }
    for (const [id, el] of rows) el.classList.toggle('active', id === agentId);
    activeAgentId = agentId;

    $('layout').classList.add('detail-open');
    $('detail-title').textContent = label;
    $('detail-sub').textContent = 'live browser session';
    $('browser-frame').innerHTML = '<span class="placeholder" id="browser-placeholder">connecting to browser…</span>';

    activeStream = new EventSource(`/agent/${agentId}/stream`);
    activeStream.onmessage = (msg) => {
      const event = JSON.parse(msg.data);
      if (event.agentId !== activeAgentId) return;
      if (event.type === 'ready') {
        $('detail-sub').textContent = event.storeUrl;
      } else if (event.type === 'frame') {
        $('browser-frame').innerHTML = `<div class="live-dot">live</div><img src="${event.dataUrl}" alt="live browser frame" />`;
      } else if (event.type === 'error') {
        $('browser-frame').innerHTML = `<span class="placeholder">${event.message}</span>`;
      }
    };
    activeStream.onerror = () => {
      $('detail-sub').textContent = 'disconnected';
    };
  }

  function closeDetail() {
    if (activeStream) {
      activeStream.close();
      activeStream = null;
    }
    activeAgentId = null;
    for (const [, el] of rows) el.classList.remove('active');
    $('layout').classList.remove('detail-open');
  }

  $('close-detail').addEventListener('click', closeDetail);

  let historyIndex = 0;

  function handle(event) {
    switch (event.type) {
      case 'authorized':
        $('task-sub').textContent = `authorized for ${fmt(event.allowance)} on ${event.budget}`;
        setStatus(`task authorized for <b>${fmt(event.allowance)}</b> on ${event.budget}`);
        break;

      case 'lease_settled': {
        $('history').classList.add('shown');
        const pip = $(`pip-${historyIndex}`);
        if (pip) pip.classList.add(event.outcome === 'failure' ? 'failed' : 'resolved');
        historyIndex++;
        $('history-rate').textContent = `${Math.round(event.resolveRate * 100)}% resolve rate (${event.resolvedCount}/${event.totalCount})`;
        setStatus(`tableware settled a prior task as <b>${event.outcome}</b> — resolve rate now ${Math.round(event.resolveRate * 100)}%`, event.outcome === 'failure');
        break;
      }

      case 'delegated': {
        const el = ensureRow(event.agentId, event.label);
        remaining -= event.allowance;
        setPool(remaining);
        el.querySelector('.sub').textContent = `wants ${fmt(event.requested ?? event.allowance)}`;
        setStatus(`${event.label} delegated ${fmt(event.allowance)} — <b>${fmt(Math.max(remaining, 0))}</b> left in the pool`);
        break;
      }

      case 'clamped': {
        const el = ensureRow(event.agentId);
        el.querySelector('.sub').innerHTML =
          `asked ${fmt(event.requested)} — <span class="trust-rate">clamped to ${fmt(event.granted)} (${Math.round(event.resolveRate * 100)}% resolve rate)</span>`;
        setStatus(`${agentLabel(event.agentId)} asked for ${fmt(event.requested)} — <b>clamped to ${fmt(event.granted)}</b> by its own track record`, true);
        break;
      }

      case 'committed': {
        const el = ensureRow(event.agentId);
        el.querySelector('.agent-status').innerHTML =
          `<span class="amt">${fmt(event.actualCost)}</span><span class="pill committed">committed</span><span class="watch-hint">watch →</span>`;
        setStatus(`${agentLabel(event.agentId)} spent ${fmt(event.actualCost)} — real cost, real deduction`);
        break;
      }

      case 'denied': {
        const el = ensureRow(event.agentId);
        el.classList.add('denied');
        el.querySelector('.sub').textContent = 'not enough left in the pool';
        el.querySelector('.agent-status').innerHTML =
          `<span class="amt denied-amt">${fmt(event.requested)}</span><span class="pill denied">denied</span>`;
        setStatus(`${agentLabel(event.agentId)} asked for ${fmt(event.requested)} — <b>denied before it ever ran</b>, no overspend`, true);
        break;
      }

      case 'settled':
        setStatus(`settled — ${fmt(event.actual)} spent, <b>${fmt(event.returned)} released</b> back automatically`);
        break;
    }
  }

  const source = new EventSource('/events');
  source.onmessage = (msg) => handle(JSON.parse(msg.data));
  source.onerror = () => {
    setStatus('lost connection to the live server — reload to run it again', true);
    source.close();
  };
</script>
</body>
</html>
