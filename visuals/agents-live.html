<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Scrip — live agent tracker</title>
<style>
  /*
    Same identity as the receipt (white/black/Ramp-yellow), reshaped from a
    single printed object into a live dashboard: one shared pool draining in
    real time as real concurrent agents pull from it, ending in one agent
    being denied by the atomic reservation math before it ever spends a
    dollar - the wedge this page exists to make obvious.

    Denied uses a separate, muted semantic red (not the Ramp-yellow accent) -
    state color is its own category, kept quiet, never fighting the one
    accent this page is allowed to spend.
  */
  :root {
    --paper: #fafaf7;
    --ink: #16150f;
    --ink-muted: #86847c;
    --ramp-yellow: #e4f222;
    --denied-red: #8a3b32;
    --surface: #101010;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--surface);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }
  .stage { width: min(420px, 92vw); display: flex; flex-direction: column; gap: 16px; }

  .eyebrow {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #8f8d86;
    text-align: center;
  }
  .eyebrow b { color: var(--ramp-yellow); font-weight: 600; }

  .wordmark {
    text-align: center;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.01em;
    font-style: italic;
    color: var(--paper);
    opacity: 0.9;
  }

  /* ---------- pool bar ---------- */
  .pool {
    background: #1c1c1c;
    border: 1px solid #2c2c2c;
    border-radius: 4px;
    padding: 14px 16px;
  }
  .pool-labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }
  .pool-labels b { color: var(--paper); font-variant-numeric: tabular-nums; }
  .pool-track {
    height: 10px;
    background: #0a0a0a;
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .pool-fill {
    height: 100%;
    width: 100%;
    background: var(--ramp-yellow);
    border-radius: 999px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ---------- agent rows ---------- */
  .agents { display: flex; flex-direction: column; gap: 8px; min-height: 168px; }

  .agent {
    background: #1c1c1c;
    border: 1px solid #2c2c2c;
    color: var(--paper);
    border-radius: 4px;
    padding: 11px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.35s ease-out, transform 0.35s ease-out, border-color 0.3s ease-out;
  }
  .agent.shown { opacity: 1; transform: translateY(0); }
  .agent.denied { border-color: var(--denied-red); }

  .agent-name {
    font-weight: 600;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .agent-name .sub {
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
  }

  .agent-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .pill {
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-muted);
  }
  .pill::before { content: '['; }
  .pill::after { content: ']'; }
  .pill.committed { color: var(--ramp-yellow); }
  .pill.pending { color: var(--ink-muted); }
  .pill.denied { color: var(--denied-red); }

  .amt { font-weight: 700; color: var(--ramp-yellow); }
  .amt.denied-amt { color: var(--denied-red); text-decoration: line-through; text-decoration-color: rgba(138,59,50,0.5); }

  .status {
    letter-spacing: 0.05em;
    color: #8f8d86;
    text-align: center;
    min-height: 1.6em;
  }
  .status b { color: var(--ramp-yellow); font-weight: 600; }
  .status.error b { color: var(--denied-red); }

  @media (prefers-reduced-motion: reduce) {
    .agent, .pool-fill { transition: none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="wordmark">SCRIP</div>
  <p class="eyebrow">one task pool. three agents pulling from it. <b>live</b>, not staged.</p>

  <div class="pool">
    <div class="pool-labels">
      <span>Research budget · task pool</span>
      <span><b id="pool-remaining">$10.00</b> left of $10.00</span>
    </div>
    <div class="pool-track"><div class="pool-fill" id="pool-fill"></div></div>
  </div>

  <div class="agents" id="agents"></div>

  <p class="status" id="status">connecting…</p>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => `$${Number(n).toFixed(2)}`;
  const TOTAL = 10;
  let remaining = TOTAL;
  const rows = new Map();

  function setStatus(text, isError = false) {
    $('status').innerHTML = text;
    $('status').classList.toggle('error', isError);
  }

  function setPool(value) {
    remaining = value;
    $('pool-remaining').textContent = fmt(Math.max(remaining, 0));
    $('pool-fill').style.width = `${Math.max((remaining / TOTAL) * 100, 0)}%`;
  }

  function agentLabel(id) {
    return id.replace('worker-', '').replace(/-/g, ' ');
  }

  function ensureRow(agentId) {
    if (rows.has(agentId)) return rows.get(agentId);
    const el = document.createElement('div');
    el.className = 'agent';
    el.innerHTML = `
      <div class="agent-name">${agentLabel(agentId)}<span class="sub">requesting…</span></div>
      <div class="agent-status"><span class="pill pending">pending</span></div>
    `;
    $('agents').appendChild(el);
    requestAnimationFrame(() => el.classList.add('shown'));
    rows.set(agentId, el);
    return el;
  }

  function handle(event) {
    switch (event.type) {
      case 'authorized':
        setStatus(`task authorized for <b>${fmt(event.allowance)}</b> on ${event.budget}`);
        break;

      case 'delegated': {
        const el = ensureRow(event.agentId);
        remaining -= event.allowance;
        setPool(remaining);
        el.querySelector('.sub').textContent = `wants ${fmt(event.allowance)}`;
        setStatus(`${agentLabel(event.agentId)} delegated ${fmt(event.allowance)} — <b>${fmt(Math.max(remaining, 0))}</b> left in the pool`);
        break;
      }

      case 'committed': {
        const el = ensureRow(event.agentId);
        el.querySelector('.agent-status').innerHTML =
          `<span class="amt">${fmt(event.actualCost)}</span><span class="pill committed">committed</span>`;
        setStatus(`${agentLabel(event.agentId)} spent ${fmt(event.actualCost)} — real cost, real deduction`);
        break;
      }

      case 'denied': {
        const el = ensureRow(event.agentId);
        el.classList.add('denied');
        el.querySelector('.sub').textContent = 'not enough left in the pool';
        el.querySelector('.agent-status').innerHTML =
          `<span class="amt denied-amt">${fmt(event.requested)}</span><span class="pill denied">denied</span>`;
        setStatus(`${agentLabel(event.agentId)} asked for ${fmt(event.requested)} — <b>denied before it ever ran</b>, no overspend`, true);
        break;
      }

      case 'settled':
        setStatus(`settled — ${fmt(event.actual)} spent, <b>${fmt(event.returned)} released</b> back automatically`);
        break;
    }
  }

  const source = new EventSource('/events');
  source.onmessage = (msg) => handle(JSON.parse(msg.data));
  source.onerror = () => {
    setStatus('lost connection to the live server — reload to run it again', true);
    source.close();
  };
</script>
</body>
</html>
