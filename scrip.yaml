team: agent-platform
ramp_entity_id: ramp-entity-demo
budgets:
  research:
    ramp_budget_id: ramp-budget-research
    # Confirmed live 2026-08-08 via `ramp funds get-agent-card-funds` as one
    # of five funds actually enrolled for agent card payments in this
    # sandbox - the account's *other* seeded "Software" fund
    # (cd1c33eb-d742-4d7e-850f-972eb3c3c53f, used until now for Fund-balance
    # reads) is not agent-card-enrolled and fails RampCliCardIssuer with a
    # real 400 ("This fund doesn't support agent card payments").
    ramp_fund_id: 695e46a0-8193-4d67-91e3-1c8eb43ec9d9
    monthly_limit: 100
    max_task_allowance: 10
    allowed_models:
      - claude-sonnet-5
      - claude-haiku-4-5-20251001
    fallback_model: claude-haiku-4-5-20251001
    on_limit: deny
    task_ttl_seconds: 900
    cost_center: AI compute
    max_delegation_depth: 3
    min_request_input_tokens: 500
    min_request_output_tokens: 200
    # Adaptive delegation cap (see settleLease()/getResolveRate() in
    # lease.ts and store.ts): an agentId needs at least 3 settled leases
    # before its resolve rate affects new delegate() calls, and only below a
    # 50% resolve rate does delegate() start clamping the requested amount.
    min_settlements_for_trust: 3
    low_trust_resolve_rate_threshold: 0.5
  support:
    ramp_budget_id: ramp-budget-support
    monthly_limit: 250
    max_task_allowance: 5
    allowed_models:
      - claude-sonnet-5
      - claude-haiku-4-5-20251001
    fallback_model: claude-haiku-4-5-20251001
    on_limit: degrade
    task_ttl_seconds: 600
    cost_center: Support automation
    max_delegation_depth: 3
    min_request_input_tokens: 500
    min_request_output_tokens: 200
  escalation:
    ramp_budget_id: ramp-budget-escalation
    monthly_limit: 50
    max_task_allowance: 5
    allowed_models:
      - claude-sonnet-5
      - claude-haiku-4-5-20251001
    fallback_model: claude-haiku-4-5-20251001
    on_limit: request-approval
    task_ttl_seconds: 600
    cost_center: Escalations
    max_delegation_depth: 3
    min_request_input_tokens: 500
    min_request_output_tokens: 200
    controller_model: claude-sonnet-5
  cross_provider_demo:
    ramp_budget_id: ramp-budget-cross-provider-demo
    monthly_limit: 50
    max_task_allowance: 5
    allowed_models:
      - claude-sonnet-5
      - gpt-5.6-luna
    fallback_model: gpt-5.6-luna
    on_limit: deny
    task_ttl_seconds: 600
    cost_center: AI compute
    max_delegation_depth: 3
    min_request_input_tokens: 500
    min_request_output_tokens: 200
