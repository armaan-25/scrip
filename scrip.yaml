team: agent-platform
entity_id: scrip-demo
budgets:
  research:
    budget_id: budget-research
    monthly_limit: 100
    max_task_allowance: 10
    allowed_models:
      - claude-sonnet-5
      - claude-haiku-4-5-20251001
    fallback_model: claude-haiku-4-5-20251001
    on_limit: deny
    task_ttl_seconds: 900
    cost_center: AI compute
    max_delegation_depth: 3
    min_request_input_tokens: 500
    min_request_output_tokens: 200
    # Adaptive delegation cap (see settleLease()/getResolveRate() in
    # lease.ts and store.ts): an agentId needs at least 3 settled leases
    # before its resolve rate affects new delegate() calls, and only below a
    # 50% resolve rate does delegate() start clamping the requested amount.
    min_settlements_for_trust: 3
    low_trust_resolve_rate_threshold: 0.5
  support:
    budget_id: budget-support
    monthly_limit: 250
    max_task_allowance: 5
    allowed_models:
      - claude-sonnet-5
      - claude-haiku-4-5-20251001
    fallback_model: claude-haiku-4-5-20251001
    on_limit: degrade
    task_ttl_seconds: 600
    cost_center: Support automation
    max_delegation_depth: 3
    min_request_input_tokens: 500
    min_request_output_tokens: 200
  escalation:
    budget_id: budget-escalation
    monthly_limit: 50
    max_task_allowance: 5
    allowed_models:
      - claude-sonnet-5
      - claude-haiku-4-5-20251001
    fallback_model: claude-haiku-4-5-20251001
    on_limit: request-approval
    task_ttl_seconds: 600
    cost_center: Escalations
    max_delegation_depth: 3
    min_request_input_tokens: 500
    min_request_output_tokens: 200
    controller_model: claude-sonnet-5
  cross_provider_demo:
    budget_id: budget-cross-provider-demo
    monthly_limit: 50
    max_task_allowance: 5
    allowed_models:
      - claude-sonnet-5
      - gpt-5.6-luna
    fallback_model: gpt-5.6-luna
    on_limit: deny
    task_ttl_seconds: 600
    cost_center: AI compute
    max_delegation_depth: 3
    min_request_input_tokens: 500
    min_request_output_tokens: 200
